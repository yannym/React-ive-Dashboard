name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client assets
        run: npx vite build --outDir dist

      - name: Inspect build output
        run: |
          echo "=== dist top-level listing ==="
          ls -la ./dist || true
          echo "=== Dist file tree (maxdepth 3) ==="
          find ./dist -maxdepth 3 -type f -print || true
          echo "=== Check for index.html at dist root ==="
          if [ -f ./dist/index.html ]; then echo "index.html found"; else echo "ERROR: index.html NOT found in ./dist"; exit 1; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
