services:
  # Unified Cockpit Dashboard + Express Backend (Port 3000)
  architect-dashboard:
    build:
      context: https://github.com/yannym/React-ive-Dashboard.git#main
      dockerfile: Dockerfile
    container_name: architect-dashboard
    ports:
      - "3200:3000"
    environment:
      PORT: "3000"
      NODE_ENV: "production"
      # Replace with your actual key or set GEMINI_API_KEY in your host environment / .env file:
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      NOTIFICATION_EMAIL: "${NOTIFICATION_EMAIL}"
      DOCKER_VOLUMES: "/srv/mergerfs/YMP/YMP"
    volumes:
      # Persistent local storage for downloads & app data (Do NOT mount host root to /app!)
      - ./downloads:/app/downloads
      - ./data:/app/data
      # OMV NAS Share Volume Mount (Optional - map host media directory to /media/nas_share)
      - /srv/mergerfs/YMP/YMP:/media/nas_share
      # Docker Socket access (Optional - allows container to monitor local Docker status)
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Optional Watchtower service to automatically update running container images
  watchtower:
    image: containrrr/watchtower
    container_name: architect-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup
    profiles:
      - auto-update

